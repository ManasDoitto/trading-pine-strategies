# trading_agents configuration. Option BUYING only, on the four underlyings below.

[paths]
data_dir = "journal_data"          # relative to repo root, gitignored

# ---------------------------------------------------------------- instruments
# Option contracts, lot sizes and strike steps are resolved live from the Dhan
# scrip master (core/instruments.py) -- nothing about expiries is hardcoded here.
# `underlying_*` = the reference series used for levels/moneyness.

[instruments.BANKNIFTY]
option_segment = "NSE_FNO"
option_instrument = "OPTIDX"
underlying_segment = "IDX_I"
underlying_instrument = "INDEX"
underlying_security_id = 25        # BANKNIFTY index (does not roll)
chain_segment = "IDX_I"
session = ["09:15", "15:30"]
tv_symbol = "NSE:BANKNIFTY"
r7_max_strikes_otm = 3             # 100-pt strikes -> 300 pts

[instruments.CRUDEOIL]
option_segment = "MCX_COMM"
option_instrument = "OPTFUT"
underlying_segment = "MCX_COMM"
underlying_instrument = "FUTCOM"   # front-month future, resolved from scrip master
chain_segment = "MCX_COMM"
lot_size = 100                     # Dhan fill qty units per lot (MCX scrip master reports 1)
future_max_gap_days = 10           # option expiry -> its underlying future's expiry; larger gap = wrong (expired) future
session = ["09:00", "23:30"]       # 23:55 when US DST ends (from 2 Nov 2026)
tv_symbol = "MCX:CRUDEOIL1!"
r7_max_strikes_otm = 6             # 50-pt strikes -> 300 pts

[instruments.SILVER]
option_segment = "MCX_COMM"
option_instrument = "OPTFUT"
underlying_segment = "MCX_COMM"
underlying_instrument = "FUTCOM"
chain_segment = "MCX_COMM"
lot_size = 30                      # kg -- verify against your first SILVER option fill
future_max_gap_days = 75           # silver options sit on the next bi-monthly future
session = ["09:00", "23:30"]
tv_symbol = "MCX:SILVER1!"
r7_max_strikes_otm = 5             # 1000-pt strikes

[instruments.SILVERM]
option_segment = "MCX_COMM"
option_instrument = "OPTFUT"
underlying_segment = "MCX_COMM"
underlying_instrument = "FUTCOM"
chain_segment = "MCX_COMM"
lot_size = 5                       # kg -- verify against your first SILVERM option fill
future_max_gap_days = 75
session = ["09:00", "23:30"]
tv_symbol = "MCX:SILVERM1!"
r7_max_strikes_otm = 5

# ---------------------------------------------------------------- rules
# Option-buyer rule detectors (core/rules.py). Tune these to your own plan.
[rules]
# R1 averaging down: re-buying the same option below the running average entry.
# Adds within r1_min_gap_minutes of the previous entry are treated as one
# (sliced) order, not an add.
r1_min_gap_minutes = 5
r1_min_drop_pct = 0.0

# R2 overnight hold of a bought option
r2_enabled = true

# R3 held into the final N calendar days before expiry (across a session close)
r3_expiry_days = 2

# R4 premium stop not respected: position closed down more than this % of entry premium
r4_premium_stop_pct = 30.0

# R5 daily realised loss limit, rupees (set to your own number)
r5_daily_loss_limit_inr = 10000

# R6 overtrading / revenge
r6_max_positions_per_day = 10
r6_revenge_window_minutes = 15
r6_revenge_loss_inr = 5000

# R7 deep-OTM "lottery" buy: at least this many strikes OTM at entry.
# Fallback only -- each instrument sets its own r7_max_strikes_otm (strike steps differ).
r7_max_strikes_otm = 3

# ---------------------------------------------------------------- journal
[journal]
rolling_sessions = 20

# ---------------------------------------------------------------- session close
[session_close]
history_days = 60                  # 5m bars fetched (needed for the v4.0 warm-up)
signal_match_minutes = 15          # how close your entry must be to a v4.0 signal to count as aligned
flat_threshold_atr = 0.25          # |close-open| below this x ATR14 = a flat session (scorecard)

# ---------------------------------------------------------------- pre-market
[premarket]
history_days = 60                  # 5m bars fetched per underlying (levels, ATR, RV, v4.0 state)
risk_free_rate = 0.065             # Black-76 cross-check
iv_rich_ratio = 1.2                # ATM IV / 20d realised vol above this = options expensive vs realised
iv_cheap_ratio = 0.9
oi_strikes_each_side = 10          # strikes around ATM used for OI walls / PCR
include_next_expiry_if_dte_le = 3  # also show the next expiry when the nearest is this close
# option-chain quality gates (silver chains were stale/illiquid in the 2026-09-16 probe)
min_atm_oi = 1
min_atm_volume = 1
max_spread_pct = 15.0              # hard gate: silver ATM spreads were >100% on 2026-09-16
iv_sane_range = [3.0, 150.0]
max_iv_model_gap = 10.0            # |Dhan IV - Black-76 IV from LTP| in vol points; beyond it Black-76 is used
max_underlying_gap_pct = 2.0       # chain last_price vs futures close; beyond it ATM is re-centred on the close

# v4.0 SHA-flip strategy parameters (working_strategies/*/1_*.pine.txt). BANKNIFTY v0.4 is not modelled.
[strategy.CRUDEOIL]
name = "CRUDE v4.0 SHA flip RR4.0 (working_strategies/CrudeOil/1)"
sha_len1 = 10
sha_len2 = 10
sw_len = 10
sw_buf = 0.1
min_sl = 1.5
max_sl = 3.0
rr = 4.0
session = ["09:15", "23:30"]

[strategy.SILVER]
name = "Silver v4.0 wide-ATR + fixed 350-pt daily limit (working_strategies/Silver/1)"
sha_len1 = 10
sha_len2 = 10
sw_len = 10
sw_buf = 0.1
min_sl = 2.5
max_sl = 5.0
rr = 3.0
day_loss_limit_pts = 350
session = ["09:15", "23:30"]

[strategy.SILVERM]
name = "Silver v4.0 wide-ATR logic applied to SILVERM (tested on SILVER1!, proxy only)"
sha_len1 = 10
sha_len2 = 10
sw_len = 10
sw_buf = 0.1
min_sl = 2.5
max_sl = 5.0
rr = 3.0
session = ["09:15", "23:30"]

# Pre-registered forward test (memory: crude-v4-forward-test). Never move these goalposts.
[forward_test.CRUDEOIL]
strategy = "v4.0 SHA flip RR3 (variant lab V21), TradingView shared slot, MCX:CRUDEOIL1! 5m"
start = "2026-09-14"
min_trades_to_judge = 60
keep_if_pf_at_least = 1.0
drop_if_drawdown_pts_above = 2100
drop_if_pf_below_after_min_trades = 0.8
normal_losing_streak = "8-9 at ~28% win rate"

# Scheduled market events shown in the pre-market brief. Add dated ones as needed, e.g.
# [[events]]
# date = "2026-10-01"
# underlyings = ["BANKNIFTY"]
# name = "RBI policy"
[[events]]
weekday = "Wednesday"
time_ist = "20:00"                 # 21:00 after US DST ends (2 Nov 2026)
underlyings = ["CRUDEOIL"]
name = "US EIA weekly petroleum status report"
