# trading_agents configuration. Option BUYING only, on the four underlyings below.

[paths]
data_dir = "journal_data"          # relative to repo root, gitignored

# ---------------------------------------------------------------- instruments
# Option contracts, lot sizes and strike steps are resolved live from the Dhan
# scrip master (core/instruments.py) -- nothing about expiries is hardcoded here.
# `underlying_*` = the reference series used for levels/moneyness.

[instruments.BANKNIFTY]
option_segment = "NSE_FNO"
option_instrument = "OPTIDX"
underlying_segment = "IDX_I"
underlying_instrument = "INDEX"
underlying_security_id = 25        # BANKNIFTY index (does not roll)
chain_segment = "IDX_I"
session = ["09:15", "15:30"]
tv_symbol = "NSE:BANKNIFTY"
r7_max_strikes_otm = 3             # 100-pt strikes -> 300 pts

[instruments.CRUDEOIL]
option_segment = "MCX_COMM"
option_instrument = "OPTFUT"
underlying_segment = "MCX_COMM"
underlying_instrument = "FUTCOM"   # front-month future, resolved from scrip master
chain_segment = "MCX_COMM"
lot_size = 100                     # Dhan fill qty units per lot (MCX scrip master reports 1)
future_max_gap_days = 10           # option expiry -> its underlying future's expiry; larger gap = wrong (expired) future
session = ["09:00", "23:30"]       # 23:55 when US DST ends (from 2 Nov 2026)
tv_symbol = "MCX:CRUDEOIL1!"
r7_max_strikes_otm = 6             # 50-pt strikes -> 300 pts

[instruments.SILVER]
option_segment = "MCX_COMM"
option_instrument = "OPTFUT"
underlying_segment = "MCX_COMM"
underlying_instrument = "FUTCOM"
chain_segment = "MCX_COMM"
lot_size = 30                      # kg -- verify against your first SILVER option fill
future_max_gap_days = 75           # silver options sit on the next bi-monthly future
session = ["09:00", "23:30"]
tv_symbol = "MCX:SILVER1!"
r7_max_strikes_otm = 5             # 1000-pt strikes

[instruments.SILVERM]
option_segment = "MCX_COMM"
option_instrument = "OPTFUT"
underlying_segment = "MCX_COMM"
underlying_instrument = "FUTCOM"
chain_segment = "MCX_COMM"
lot_size = 5                       # kg -- verify against your first SILVERM option fill
future_max_gap_days = 75
session = ["09:00", "23:30"]
tv_symbol = "MCX:SILVERM1!"
r7_max_strikes_otm = 5

[instruments.NIFTY]
option_segment = "NSE_FNO"
option_instrument = "OPTIDX"
underlying_segment = "IDX_I"
underlying_instrument = "INDEX"
underlying_security_id = 13        # NIFTY 50 index (does not roll)
chain_segment = "IDX_I"
session = ["09:15", "15:30"]
tv_symbol = "NSE:NIFTY"
r7_max_strikes_otm = 3             # 50-pt strikes -> 150 pts

# ---------------------------------------------------------------- rules
# Option-buyer rule detectors (core/rules.py). Tune these to your own plan.
[rules]
# R1 averaging down: re-buying the same option below the running average entry.
# Adds within r1_min_gap_minutes of the previous entry are treated as one
# (sliced) order, not an add.
r1_min_gap_minutes = 5
r1_min_drop_pct = 0.0

# R2 overnight hold of a bought option
r2_enabled = true

# R3 held into the final N calendar days before expiry (across a session close)
r3_expiry_days = 2

# R4 premium stop not respected: position closed down more than this % of entry premium
r4_premium_stop_pct = 30.0

# R5 daily realised loss limit, rupees (set to your own number)
r5_daily_loss_limit_inr = 10000

# R6 overtrading / revenge
r6_max_positions_per_day = 10
r6_revenge_window_minutes = 15
r6_revenge_loss_inr = 5000

# R7 deep-OTM "lottery" buy: at least this many strikes OTM at entry.
# Fallback only -- each instrument sets its own r7_max_strikes_otm (strike steps differ).
r7_max_strikes_otm = 3

# ---------------------------------------------------------------- journal
[journal]
rolling_sessions = 20

# ---------------------------------------------------------------- session close
[session_close]
history_days = 60                  # 5m bars fetched (needed for the v4.0 warm-up)
signal_match_minutes = 15          # how close your entry must be to a v4.0 signal to count as aligned
flat_threshold_atr = 0.25          # |close-open| below this x ATR14 = a flat session (scorecard)

# ---------------------------------------------------------------- pre-market
[premarket]
history_days = 60                  # 5m bars fetched per underlying (levels, ATR, RV, v4.0 state)
risk_free_rate = 0.065             # Black-76 cross-check
iv_rich_ratio = 1.2                # ATM IV / 20d realised vol above this = options expensive vs realised
iv_cheap_ratio = 0.9
oi_strikes_each_side = 10          # strikes around ATM used for OI walls / PCR
include_next_expiry_if_dte_le = 3  # also show the next expiry when the nearest is this close
# option-chain quality gates (silver chains were stale/illiquid in the 2026-09-16 probe)
min_atm_oi = 1
min_atm_volume = 1
max_spread_pct = 15.0              # hard gate: silver ATM spreads were >100% on 2026-09-16
iv_sane_range = [3.0, 150.0]
max_iv_model_gap = 10.0            # |Dhan IV - Black-76 IV from LTP| in vol points; beyond it Black-76 is used
max_underlying_gap_pct = 2.0       # chain last_price vs futures close; beyond it ATM is re-centred on the close

# Strategy parameters. Set 2026-09-28 to the dashboard's best pick per instrument
# (strategy_audit_2026_09/strategy_comparison_dashboard.html), replacing what trading_exec had been
# running (v4.0 base for Crude/Silver, v0.4 for BankNifty - see git history for those definitions).
[strategy.CRUDEOIL]
# v4.2: crude #1's entry/stop UNCHANGED (SHA flip + EMA9/22, 10-bar swing stop, 1.5-3.0x ATR).
# NO fixed R:R target - exit is the stop, or a reversal_exit (an opposite valid signal while in a
# position; fills next bar's open, same as a fresh entry). rr is unused or the Signal.rr field.
name = "CRUDE v4.2 reversal-exit, no fixed target (dashboard best pick, 2026-09-28)"
sha_len1 = 10
sha_len2 = 10
sw_len = 10
sw_buf = 0.1
min_sl = 1.5
max_sl = 3.0
rr = 0.0
reversal_exit = true
# INFORMATIONAL ONLY - never used by simulate() (reversal_exit ignores rr entirely) or the shadow
# tracker's real exit. A reference price shown alongside the alert for a quick office-hours glance,
# computed from the 30-month backtest: avg win 172.4 pts / avg risk_pts 30.4 = 5.67R (172 winning
# trades of 817, 21.1% win rate; median win is much lower, 83 pts - the mean is pulled up by a few
# large trend-riding wins, so treat this as a loose target, not a tight one).
ref_rr = 5.7
session = ["09:15", "23:30"]

[strategy.SILVER]
# v4.1 bo(3): #1's flip entry OR a 3-bar Donchian breakout, same EMA9/22 trend filter and stops as
# #1. See bo_lookback in signals.py::v40_frame. Beats the flip-only incumbent on SILVER1!'s own
# 30-month history (PF 1.563 vs 1.503, +337,941 vs +222,240 pts) - see silver_final_comparison.py.
# exclude_hours 15-16 IST added 2026-09-28: a structural low-liquidity window, holdout-validated
# across 4 split points (see signals.py::v40_frame's comment on exclude_hours for the full case).
name = "Silver v4.1 SHA flip + 3-bar Donchian breakout, wide-ATR + 350pt daily limit, 15-17h excluded (dashboard best pick, 2026-09-28)"
sha_len1 = 10
sha_len2 = 10
sw_len = 10
sw_buf = 0.1
min_sl = 2.5
max_sl = 5.0
rr = 3.0
bo_lookback = 3
# "Daily brake", not a loss cap: once the day's CLOSED trades total -350 pts or worse, no new entries that day.
# Typical stops are wider (median ~480, mean ~1000 pts), so in practice one stop-out ends the day. Tested against
# 1000/1500/2000/3000/none/max-2-trades on 33 months (2026-10-03): 350 was the best on profit factor and drawdown.
day_loss_limit_pts = 350
session = ["09:15", "23:30"]
exclude_hours = [15, 16]

[strategy.SILVERM]
# Same v4.1 bo(3) as SILVER, kept for SILVERM's OWN price action (used only by the premarket/
# session-close briefs, which price SILVERM directly - trading_exec now signals SILVERM's traded
# options off SILVER1! instead, via signal_from in trading_exec/config.toml; see the 2026-09-28
# backtest that found SILVER1! outperforms SILVERM1! on both variants over the same 30-month window).
name = "Silver v4.1 SHA flip + 3-bar Donchian breakout, 15-17h excluded, on SILVERM's own price action"
sha_len1 = 10
sha_len2 = 10
sw_len = 10
sw_buf = 0.1
min_sl = 2.5
max_sl = 5.0
rr = 3.0
bo_lookback = 3
# "Daily brake", not a loss cap: once the day's CLOSED trades total -350 pts or worse, no new entries that day.
# Typical stops are wider (median ~480, mean ~1000 pts), so in practice one stop-out ends the day. Tested against
# 1000/1500/2000/3000/none/max-2-trades on 33 months (2026-10-03): 350 was the best on profit factor and drawdown.
day_loss_limit_pts = 350
session = ["09:15", "23:30"]
exclude_hours = [15, 16]

# Supertrend(20,3) + above-average volume, on the front-month FUTURE (NSE:BANKNIFTY1!) - needs
# volume, which the index lacks (same reason v0.4 ran on the future). engine = "supertrend" ->
# trading_agents/core/signals_scalp.py. Re-enabled 2026-09-28, replacing v0.4 (paused since
# 2026-09-18, unverified port): TV 6-window replay PF 1.284, +14,450 net, 6/6 windows profitable.
[strategy.BANKNIFTY]
engine = "supertrend"
name = "BankNifty Supertrend(20,3) + above-avg volume scalp (dashboard best pick, 2026-09-28)"
st_mult = 3.0
st_period = 20
use_vol_filter = true
vol_len = 20
min_sl = 1.0
rr = 1.5
time_stop_min = 45
entry_window = ["09:15", "15:20"]
flat_window = ["15:20", "15:30"]

# Ichimoku Tenkan(9)/Kijun(26) cross, filtered to the EMA200 trend, on the NIFTY index directly (no
# volume needed). engine = "tenkan_kijun" -> trading_agents/core/signals_scalp.py. New 2026-09-28:
# positive in all 10 calendar years 2017-2026 on Dhan's full history (nifty_dhan_fresh.py).
[strategy.NIFTY]
# ema200_dist_min + rr=2.5 added 2026-09-29: fewer, higher-quality trades (see signals_scalp.py::
# tenkan_frame's comment for the full holdout-validated case; ~20 stricter alternatives were tried
# and rejected first). 11% fewer trades, PF 1.152->1.175, holdout net +2,392->+2,731, 10/10 years kept.
engine = "tenkan_kijun"
name = "Nifty Tenkan(9)/Kijun(26) + EMA200 scalp, EMA200 distance filter (dashboard best pick, 2026-09-29)"
tenkan_len = 9
kijun_len = 26
ema200_len = 200
ema200_dist_min = 1.0
min_sl = 1.0
rr = 2.5
time_stop_min = 45
entry_window = ["09:15", "15:20"]
flat_window = ["15:20", "15:30"]

# Pre-registered forward test (memory: crude-v4-forward-test). Never move these goalposts.
[forward_test.CRUDEOIL]
strategy = "v4.0 SHA flip RR3 (variant lab V21), TradingView shared slot, MCX:CRUDEOIL1! 5m"
start = "2026-09-14"
min_trades_to_judge = 60
keep_if_pf_at_least = 1.0
drop_if_drawdown_pts_above = 2100
drop_if_pf_below_after_min_trades = 0.8
normal_losing_streak = "8-9 at ~28% win rate"

# Scheduled market events shown in the pre-market brief. Add dated ones as needed, e.g.
# [[events]]
# date = "2026-10-01"
# underlyings = ["BANKNIFTY"]
# name = "RBI policy"
[[events]]
weekday = "Wednesday"
time_ist = "20:00"                 # 21:00 after US DST ends (2 Nov 2026)
underlyings = ["CRUDEOIL"]
name = "US EIA weekly petroleum status report"
