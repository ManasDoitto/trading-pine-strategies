# trading_exec configuration.
#
# Stage A (current): signals -> alerts -> shadow records. No order-capable code exists yet.
# Stage C would add live orders, and is gated by BOTH live_enabled here AND ENABLE_LIVE=true in .env.

[mode]
stage = "A"
live_enabled = false

[paths]
data_dir = "exec_data"              # relative to repo root, gitignored

[source]
poll_seconds = 60                   # how often to check for a newly closed 5m bar
history_days = 30                   # bars fetched per poll (v4.0 needs ~250 bars of warm-up)
stale_signal_minutes = 12           # ignore a signal whose bar closed longer ago than this
interval_minutes = 5

[shadow]
cost_per_lot_inr = 45.0             # per leg, per lot: brokerage + taxes estimate
premium_stop_pct = 30.0             # the R4 comparison exit, tracked alongside the real exit
poll_seconds = 120                  # how often open shadow positions are marked

# Watches the REAL account (any instrument Dhan reports, not just the three above) and alerts on
# Telegram. Read-only: it never places or closes anything. Each alert fires once per position per day.
[trade_watch]
enabled = true
poll_seconds = 20                   # premium on a 0-DTE contract can fall 25% inside a minute
warn_pct = 15.0                     # first heads-up on a losing position
cut_pct = 25.0                      # "cut it" - the trader's own line, tighter than the journal's R4 30%
profit_alert_inr = 0                # 0 = use the average win from the newest journal facts
profit_multiple = 1.0               # alert once unrealised >= this x that average win
averaging_down_alert = true         # R1: quantity added while the average entry is falling
closed_summary = true

# "still down this much after this long" - trades that die slowly rather than fast.
[[trade_watch.hold_rules]]
after_min = 30
loss_pct = 10.0

[[trade_watch.hold_rules]]
after_min = 60
loss_pct = 15.0

[[trade_watch.hold_rules]]
after_min = 120
loss_pct = 5.0

[guards]
max_signals_per_day = 6             # across all instruments
max_open_per_strategy = 2           # don't flag a signal until 2+ of the same strategy are already open;
                                    # was 1 (each strategy normally holds one position at a time), raised
                                    # 2026-10-03 at the user's request (briefly set to 3, then settled on 2).
                                    # Was a shared max_open_positions = 2 before that, which let one
                                    # instrument's trade block every OTHER instrument's -- that bug is what
                                    # this comment used to describe; this "2" is a different, scoped setting.
daily_loss_limit_inr = 10000        # mirrors the journal's R5
session_buffer_minutes = 15         # no new entries within N minutes of the session close

[notify]
telegram = true
email = true

# Per instrument. `enabled` is the master switch for the signal source.
[instruments.CRUDEOIL]
enabled = true
lots = 2
min_dte = 2                         # crude ATM theta was ~27% of premium/day at DTE 1
max_spread_pct = 15.0

# Silver Mini: signal computed on SILVERM1! itself, the same chart whose options are bought (changed
# 2026-10-03 at the trader's request - the signal chart should be the traded chart). It had been
# computed on SILVER1! since 2026-09-28 because that scored a higher total on 30 months of history
# (+302k vs +241k points, PF 1.47 vs 1.37); on SILVERM1! the strategy had MORE profitable months
# (55% vs 48%, TradingView replay 56%) and slightly shorter losing runs of trades, at a somewhat
# larger drawdown. Uses [strategy.SILVERM] in trading_agents/config.toml (identical v4.1 settings).
# To go back, add: signal_from = "SILVER"
[instruments.SILVERM]
enabled = true
lots = 2
min_dte = 2
# 2026-10-03: 15 -> 5. The 6 recorded SILVERM entries all had spreads of 0.1-0.5% of the premium; liquid strikes (225k/228k/230k) trade at
# 0.4-2%, thin ones at 10-90%. A signal whose ATM option is wider than this is still alerted but is followed on the underlying only.
max_spread_pct = 5.0

# BankNifty Supertrend(20,3)+volume runs on the front-month FUTURE (NSE:BANKNIFTY1!) - it needs
# volume - and is bought as BANKNIFTY index options. Its trades are flat by 15:20.
#
# RE-ENABLED 2026-09-28 on the new Supertrend engine (trading_agents/config.toml [strategy.BANKNIFTY],
# engine="supertrend"), replacing v0.4 which had been PAUSED since 2026-09-18 (unverified port: 1 trade
# in a 1 Jul-17 Sep replay vs an expected ~2.5/month). Supertrend is validated by a 6-window TradingView
# replay (PF 1.284, +14,450 net, 6/6 windows profitable) - see strategy_comparison_dashboard.html.
[instruments.BANKNIFTY]
enabled = true
signal_series = "future"
lots = 2
min_dte = 2
max_spread_pct = 15.0

# Nifty Tenkan(9)/Kijun(26)+EMA200 runs on the NIFTY index directly (no volume needed). New 2026-09-28.
[instruments.NIFTY]
enabled = true
lots = 1
min_dte = 2
max_spread_pct = 15.0
